{% extends "base.html" %}

{% block content %}
<h1>Filament Inventory</h1>

<div class="row">
    <div class="col-md-6">
        <h3>Add Stock</h3>
        <form onsubmit="addStock(event)">
            <div class="mb-3">
                <label>Color:</label>
                <select id="color" class="form-control" required>
                    <option value="">Select color...</option>
                    <option value="Black (Basic)">Black (Basic)</option>
                    <option value="White (Matte)">White (Matte)</option>
                    <option value="Red (Basic)">Red (Basic)</option>
                    <option value="Green (Matte Grass)">Green (Matte Grass)</option>
                    <option value="Blue (Basic)">Blue (Basic)</option>
                    <option value="Gold (Basic)">Gold (Basic)</option>
                    <option value="Ice Blue (Matte)">Ice Blue (Matte)</option>
                    <option value="Orange (Matte Mandarin)">Orange (Matte Mandarin)</option>
                    <option value="Bambu Green (Basic)">Bambu Green (Basic)</option>
                    <option value="Pink (Matte Sakura)">Pink (Matte Sakura)</option>
                    <option value="Yellow (Matte)">Yellow (Matte)</option>
                    <option value="Red (Maroon)">Red (Maroon)</option>
                    <option value="Cobalt Blue">Cobalt Blue</option>
                    <option value="Cyan">Cyan</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Quantity (packages):</label>
                <input type="number" id="quantity" class="form-control" min="0" step="1" required>
            </div>
            <button type="submit" class="btn btn-success">Add to Stock</button>
        </form>
    </div>

    <div class="col-md-6">
        <h3>Move to Printer</h3>
        <form onsubmit="moveFilament(event)">
            <div class="mb-3">
                <label>Filament:</label>
                <select id="filament_id" class="form-control" required>
                    <option value="">Select filament...</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Printer:</label>
                <select id="printer" class="form-control" required>
                    <option value="">Select printer...</option>
                </select>
            </div>
            <div class="mb-3">
                <label>AMS Slot:</label>
                <select id="ams_slot" class="form-control" required>
                    <option value="0">Slot 0</option>
                    <option value="1">Slot 1</option>
                    <option value="2">Slot 2</option>
                    <option value="3">Slot 3</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Quantity (packages):</label>
                <input type="number" id="move_quantity" class="form-control" min="1" step="1" required>
            </div>
            <button type="submit" class="btn btn-primary">Move to Printer</button>
        </form>
    </div>
</div>

<h3 class="mt-5">Current Stock</h3>
<table class="table" id="stock-table">
    <thead>
        <tr>
            <th>Color</th>
            <th>Quantity (packages)</th>
            <th>Status</th>
            <th>Added</th>
        </tr>
    </thead>
    <tbody id="stock-tbody"></tbody>
</table>

<h3>Recent Moves</h3>
<table class="table">
    <thead>
        <tr>
            <th>Filament</th>
            <th>Printer</th>
            <th>AMS Slot</th>
            <th>Quantity (packages)</th>
            <th>Type</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody id="moves-tbody"></tbody>
</table>

<script>
const REFRESH_INTERVAL = 5000; // 5 seconds
let printers = [];

function renderInventory(data) {
    // Render stock
    const stockBody = document.getElementById('stock-tbody');
    stockBody.innerHTML = '';
    for (const item of data.stock) {
        const statusBadge = item.quantity_packages < 5 ? '<span class="badge bg-danger">LOW</span>' :
                            item.quantity_packages < 10 ? '<span class="badge bg-warning">Medium</span>' :
                            '<span class="badge bg-success">Good</span>';
        const rowClass = item.quantity_packages < 5 ? 'table-warning' : '';
        const html = `
            <tr class="${rowClass}">
                <td>${item.color}</td>
                <td><strong>${item.quantity_packages}</strong> ${item.quantity_packages < 5 ? '<span class="badge bg-danger">LOW</span>' : ''}</td>
                <td>${statusBadge}</td>
                <td>${item.added_date}</td>
            </tr>
        `;
        stockBody.innerHTML += html;
    }

    // Render moves
    const movesBody = document.getElementById('moves-tbody');
    movesBody.innerHTML = '';
    for (const move of data.moves) {
        const html = `
            <tr>
                <td>#${move.filament_id}</td>
                <td>${move.printer}</td>
                <td>${move.ams_slot}</td>
                <td>${move.quantity_packages}</td>
                <td>${move.move_type}</td>
                <td>${move.timestamp}</td>
            </tr>
        `;
        movesBody.innerHTML += html;
    }

    // Update filament dropdown
    const filamentSelect = document.getElementById('filament_id');
    const oldValue = filamentSelect.value;
    filamentSelect.innerHTML = '<option value="">Select filament...</option>';
    for (const item of data.stock) {
        filamentSelect.innerHTML += `<option value="${item.id}">${item.color} (${item.quantity_packages} packages)</option>`;
    }
    filamentSelect.value = oldValue;
}

function refreshInventory() {
    fetch('/dashboard/api/inventory')
        .then(r => r.json())
        .then(data => renderInventory(data))
        .catch(e => console.error('Failed to refresh inventory:', e));
}

function addStock(e) {
    e.preventDefault();
    const data = {
        color: document.getElementById('color').value,
        quantity: document.getElementById('quantity').value
    };
    fetch('/dashboard/inventory/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(d => {
        if (d.success) {
            alert('Added to stock');
            document.getElementById('color').value = '';
            document.getElementById('quantity').value = '';
            refreshInventory();
        } else alert('Error: ' + d.error);
    })
    .catch(e => alert('Error: ' + e));
}

function moveFilament(e) {
    e.preventDefault();
    const data = {
        filament_id: document.getElementById('filament_id').value,
        printer: document.getElementById('printer').value,
        ams_slot: document.getElementById('ams_slot').value,
        quantity: document.getElementById('move_quantity').value
    };
    fetch('/dashboard/inventory/move', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(d => {
        if (d.success) {
            alert('Moved to printer and stock updated');
            document.getElementById('move_quantity').value = '';
            refreshInventory();
        } else alert('Error: ' + d.error);
    })
    .catch(e => alert('Error: ' + e));
}

// Load printers and initial data
fetch('/dashboard/api/printers')
    .then(r => r.json())
    .then(data => {
        printers = Object.keys(data);
        const printerSelect = document.getElementById('printer');
        printerSelect.innerHTML = '<option value="">Select printer...</option>';
        for (const p of printers) {
            printerSelect.innerHTML += `<option value="${p}">${p}</option>`;
        }
    });

refreshInventory();
setInterval(refreshInventory, REFRESH_INTERVAL);
</script>
{% endblock %}
