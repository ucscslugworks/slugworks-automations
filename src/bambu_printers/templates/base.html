<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambu Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .sidebar {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        .sidebar a:hover {
            background: #f0f0f0;
            border-left-color: #667eea;
        }
        .sidebar a.active {
            background: #667eea;
            color: white;
            border-left-color: #667eea;
        }
        .main-content {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            min-height: 600px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2">
                <div class="sidebar">
                    <h5>Dashboard</h5>
                    <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">Home</a>
                    <a href="/dashboard/printers" class="{% if 'printers' in request.path %}active{% endif %}">Printers</a>
                    <a href="/dashboard/prints" class="{% if 'prints' in request.path %}active{% endif %}">Prints</a>
                    <a href="/dashboard/users" class="{% if 'users' in request.path %}active{% endif %}">Users</a>
                    <a href="/dashboard/inventory" class="{% if 'inventory' in request.path %}active{% endif %}">Inventory</a>
                </div>
            </div>
            <div class="col-md-10">
                <div class="main-content">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
