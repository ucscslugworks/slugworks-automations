<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ makerspace_name }} Checkout{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-box">🧰</span>
        <span class="brand-text">
          <strong>Makerspace&nbsp;Depot</strong>
          <small>{{ makerspace_name }}</small>
        </span>
      </a>
      {% block search %}{% endblock %}
      <nav class="topnav">
        <a href="{{ url_for('index') }}">Checkout</a>
        <a href="{{ url_for('admin') }}">Inventory Admin</a>
      </nav>
    </div>
    {% block subbar %}{% endblock %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ makerspace_name }} — item &amp; room-key checkout. Dummy demo data.</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
